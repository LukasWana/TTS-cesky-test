<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Voice Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      min-height: 400px;
      max-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    h2 {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      font-size: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 3px;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #333;
    }

    .section-title {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .voice-select {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a4a;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .voice-select:focus {
      border-color: #667eea;
    }

    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .param-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .param-group label {
      font-size: 10px;
      color: #888;
    }

    .param-input {
      width: 100%;
      padding: 6px 8px;
      background: #2a2a4a;
      border: 1px solid #444;
      border-radius: 6px;
      color: white;
      font-size: 12px;
      outline: none;
    }

    .param-input:focus {
      border-color: #667eea;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #2a2a4a;
      border-top: 1px solid #333;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #444;
      color: white;
    }

    .btn-secondary:hover {
      background: #555;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .playlist {
      padding: 8px 0;
    }

    .playlist-empty {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
      border-bottom: 1px solid #2a2a4a;
      cursor: pointer;
      transition: background 0.2s;
    }

    .playlist-item:hover {
      background: #2a2a4a;
    }

    .playlist-item.playing {
      background: linear-gradient(90deg, rgba(102, 126, 234, 0.2), transparent);
      border-left: 3px solid #667eea;
    }

    .playlist-item-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-item-text {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ccc;
    }

    .playlist-item-meta {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .playlist-item-remove {
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      color: #666;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .playlist-item-remove:hover {
      background: #dc3545;
      color: white;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #2a2a4a;
    }

    .playlist-header-title {
      font-size: 12px;
      color: #888;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: #dc3545;
      font-size: 11px;
      cursor: pointer;
    }

    .clear-btn:hover {
      text-decoration: underline;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #888;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #333;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status {
      padding: 8px 16px;
      font-size: 11px;
      text-align: center;
      color: #888;
      background: #2a2a4a;
    }
  </style>
</head>

<body>
  <h2>🎵 Voice Assistant</h2>

  <div class="scroll-container">
    <!-- Voice Selection -->
    <div class="section">
      <div class="section-title">Hlas</div>
      <select id="voiceSelect" class="voice-select">
        <option value="">Načítám...</option>
      </select>
    </div>

    <!-- Parameters -->
    <div class="section" style="display: none;">
      <div class="section-title">Parametry</div>
      <div class="params-grid">
        <div class="param-group">
          <label>Rychlost</label>
          <input type="number" id="speed" class="param-input" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="param-group">
          <label>Teplota</label>
          <input type="number" id="temperature" class="param-input" min="0.1" max="1.5" step="0.05" value="0.96">
        </div>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist">
      <div class="playlist-header">
        <span class="playlist-header-title">Playlist</span>
        <button id="clearPlaylist" class="clear-btn">Vymazat</button>
      </div>
      <div id="playlistContainer">
        <div class="playlist-empty">Vyberte text na stránce pro generování</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="playBtn" class="btn btn-primary">
      <span>▶</span> Přehrát
    </button>
  </div>

  <div id="status" class="status">Připraveno</div>

  <!-- Audio element for popup playback -->
  <audio id="popupAudio" style="display: none;"></audio>

  <script src="popup.js"></script>
</body>

</html>
